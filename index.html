<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oubral's Lantern</title>
<meta name="description" content="Making the most detailed isometric pixel RPG. Devlogs, Discord and more.">
<meta property="og:title" content="Oubral's Lantern">
<meta property="og:description" content="Making the most detailed isometric pixel RPG.">
<meta property="og:image" content="https://oubralslantern.github.io/x_header_v2_1500x500.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e0b16; --ink2: #1a1526; --bone: #efe8d8; --amber: #ffc440; --amber2: #d4a849; --rust: #5c3420; --muted: #a79f8e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--bone); }
  body { font-family: 'Silkscreen', ui-monospace, monospace; min-height: 100vh; }
  img { image-rendering: pixelated; display: block; }
  .hero { position: relative; height: 260px; overflow: hidden; border-bottom: 4px solid var(--ink2); }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 45%; filter: brightness(.55); }
  .hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 80px;
    background: linear-gradient(to bottom, transparent, var(--ink)); }
  main { max-width: 460px; margin: -150px auto 0; padding: 0 16px 48px; position: relative; z-index: 1; text-align: center; }
  .logo { width: min(320px, 82%); margin: 0 auto 14px; }
  .tag { color: var(--bone); font-size: 13px; letter-spacing: .5px; line-height: 1.6; margin: 0 0 4px; }
  .tag b { color: var(--amber); font-weight: 400; }
  .sub { color: var(--muted); font-size: 11px; margin: 0 0 26px; }
  nav { display: flex; flex-direction: column; gap: 12px; }
  a.btn, span.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 12px 18px;
    font-family: inherit; font-size: 15px; text-decoration: none; color: var(--bone); background: var(--ink2);
    border: 3px solid var(--amber2); box-shadow: 4px 4px 0 #000; transition: transform .08s, box-shadow .08s; }
  a.btn:hover, a.btn:focus-visible { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; outline: none; border-color: var(--amber); }
  a.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  a.btn.main { background: var(--amber); color: var(--ink); border-color: var(--amber); }
  span.btn { opacity: .5; border-style: dashed; cursor: default; }
  .btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
  footer { margin-top: 30px; color: var(--muted); font-size: 10px; line-height: 1.8; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="hero"><img src="keyart.jpg" alt=""></div>
  <main>
    <img class="logo" src="logo.png" alt="Oubral's Lantern">
